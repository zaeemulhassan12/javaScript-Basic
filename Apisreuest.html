<script>
const requesturl = "https://randomuser.me/api/"
const xml = new XMLHttpRequest()
    xml.open('GET' ,requesturl)
    xml.onreadystatechange = function () {
        console.log(xml.readyState);
        if (xml.readyState==4) {
            const data =xml.responseText
            console.log(data);
            console.log(data.gender);
            
        }
    }

    xml.send()
</script>
